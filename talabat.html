
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talabat Food Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #e8edf5;
    padding: 8px;
}

.container {
    max-width: 390px;
    margin: auto;
    background: white;
    border-radius: 15px;
    padding: 12px;
    min-height: 100vh;
}

.header {
    background: #ff5a00;
    padding: 12px 10px;
    border-radius: 10px;
    color: white;
    margin-bottom: 8px;
}

.header h2 {
    font-size: 17px;
    margin-bottom: 3px;
}

.header p {
    font-size: 9px;
    margin-bottom: 10px;
}

.search {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 7px;
    outline: none;
    font-size: 10px;
}

.restaurant {
    background: #f7f9fa;
    border: 1px solid #e0e6eb;
    border-radius: 9px;
    padding: 7px;
    margin-top: 8px;
}

.restaurant img {
    width: 100%;
    height: 62px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
}

.restaurant h3 {
    font-size: 11px;
    color: #253247;
    margin-top: 7px;
    margin-bottom: 4px;
}

.details {
    font-size: 9px;
    color: #718096;
    margin-bottom: 7px;
}

.menu-btn {
    width: 100%;
    border: none;
    background: #ff5a00;
    color: white;
    padding: 8px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
}

.menu-btn:hover {
    background: #e94e00;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Talabat</h2>
        <p>Delivering to: New Cairo, 5th Settlement</p>

        <input
            type="text"
            class="search"
            placeholder="Search for food, groceries, coffee..."
        >
    </div>

    <!-- Restaurant 1 -->
    <div class="restaurant">
        <img
            src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
            alt="Burger"
        >

        <h3>Burger Republic</h3>

        <p class="details">
            4.8 stars · Burgers and Fries · 25 mins · Free Delivery
        </p>

        <button class="menu-btn"
            onclick="alert('Burger Republic Menu')">
            Open Burger Republic Menu
        </button>
    </div>

    <!-- Restaurant 2 -->
    <div class="restaurant">
        <img
            src="https://images.unsplash.com/photo-1579751626657-72bc17010498?w=600"
            alt="Pizza"
        >

        <h3>Napoli Woodfire Pizza</h3>

        <p class="details">
            4.6 stars · Italian Pizza · 35 mins · 15 EGP Delivery
        </p>

        <button class="menu-btn"
            onclick="alert('Napoli Pizza Menu')">
            Open Napoli Pizza Menu
        </button>
    </div>

</div>

</body>
</html>
